{% extends 'base.html' %}{% block content %}<div class="auth"><form method="post" class="panel"><span class="pill">WELCOME TO PLACEIQ</span><h1>{{mode}}</h1>{% if mode=='Register' %}<label>Full name<input name="name" required></label><label>Department<select name="department"><option>CSE</option><option>IT</option><option>ECE</option><option>EEE</option><option>AIML</option></select></label>{% endif %}<label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="btn">{{mode}}</button><p>{% if mode=='Login' %}New student? <a href="{{url_for('register')}}">Create account</a>{% else %}Already registered? <a href="{{url_for('login')}}">Login</a>{% endif %}</p></form></div>{% endblock %}
