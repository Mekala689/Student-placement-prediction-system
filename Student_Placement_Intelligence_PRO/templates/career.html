{% extends 'base.html' %}{% block content %}<div class="top"><div><span class="eyebrow">CAREER</span><h1>Career Role Match</h1><p>Matches are based on skills saved in your profile.</p></div></div><div class="cards3">{% for role,pct,missing in rows %}<div class="card"><span class="score">{{pct}}%</span><h2>{{role}}</h2><div class="meter"><i style="width:{{pct}}%"></i></div><p><b>Skills to add:</b> {{missing|join(', ') if missing else 'Great match ✓'}}</p></div>{% endfor %}</div>{% endblock %}
